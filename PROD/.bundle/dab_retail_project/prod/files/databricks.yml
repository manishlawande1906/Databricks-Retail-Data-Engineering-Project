    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    workspace:
      host: https://adb-7405610372223220.0.azuredatabricks.net/
    
  prod:
    mode: production
    workspace:
      host: https://adb-7405610372223220.0.azuredatabricks.net/
      # We explicitly deploy to /Workspace/Users/manishp20042000@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/manishp20042000@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    
    permissions:
      - user_name: manishp20042000@gmail.com
        level: CAN_MANAGE
